[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "wildscape"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "rasterio>=1.4", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.7", "Pillow>=11", "httpx>=0.28", "psycopg[binary]>=3.2", "PyYAML>=6", "h3>=4.2", "jsonschema>=4.23"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
[project.scripts]
wildscape = "wildscape.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["wildscape*"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
